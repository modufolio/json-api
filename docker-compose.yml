# Databases for running the suite against a real engine.
#
#   docker compose up -d
#   DB_DRIVER=pdo_mysql  DB_PORT=3307 DB_USER=root DB_PASSWORD=secret vendor/bin/phpunit
#   DB_DRIVER=pdo_pgsql  DB_PORT=5433 DB_USER=postgres DB_PASSWORD=secret vendor/bin/phpunit
#   DB_DRIVER=pdo_sqlsrv DB_PORT=1434 DB_USER=sa DB_PASSWORD='Secret_1234' vendor/bin/phpunit
#
# Ports are shifted off the defaults so these never collide with an engine
# already running on the host. SQLite needs nothing and stays the default.
services:
  mysql:
    image: mysql:8.4
    ports: ['3307:3306']
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: json_api_test
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-psecret']
      interval: 5s
      retries: 20

  postgres:
    image: postgres:16
    ports: ['5433:5432']
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: json_api_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports: ['1434:1433']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Secret_1234'
      MSSQL_PID: Developer
